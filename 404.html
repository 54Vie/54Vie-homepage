<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<base href="/"/>
<link rel="icon" type="image/png" href="images/logo_54vie_2025.png"/>
<link rel="apple-touch-icon" href="images/logo_54vie_2025.png"/>
<title>404 — Không tìm thấy trang | 54Vie</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; min-height: 100%; background: #F6F8F6; font-family: Inter, -apple-system, system-ui, sans-serif; color: #0F1B14; }
  * { box-sizing: border-box; }
  .wrap {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 32px 24px;
  }
  .logo { height: 56px; margin-bottom: 40px; }
  .code {
    font-size: clamp(96px, 22vw, 180px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -0.04em;
    color: #0A289B;
    margin: 0;
  }
  .title {
    font-size: clamp(20px, 4vw, 28px);
    font-weight: 800;
    margin: 16px 0 8px;
  }
  .desc {
    font-size: 16px;
    color: #7A8881;
    max-width: 420px;
    line-height: 1.6;
    margin: 0 0 36px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0A289B;
    color: #FFFFFF;
    text-decoration: none;
    font-weight: 700;
    font-size: 16px;
    padding: 14px 28px;
    border-radius: 999px;
    transition: background .15s ease;
  }
  .btn:hover { background: #081E78; }
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="images/logo_54vie_2025.png" alt="54Vie"/>
  <h1 class="code">404</h1>
  <p class="title">Không tìm thấy trang</p>
  <p class="desc">Trang bạn tìm không tồn tại hoặc đã được di chuyển. Hãy quay về trang chủ để tiếp tục.</p>
  <a class="btn" href="/">Về trang chủ</a>
</div>
</body>
</html>
